[project]
name = "sciencebro"
version = "0.1.0"
description = "Local-first AI-assisted computational research workbench. First target: independent audit of AI-discovered black-hole metrics (AInstein)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Andrey Pluzhnik" }]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "ruamel.yaml>=0.18",
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=5.22",
    "streamlit>=1.35",
    "requests>=2.32",
]

[project.optional-dependencies]
science = [
    "sympy>=1.12",
    "scipy>=1.13",
    "mpmath>=1.3",
    "matplotlib>=3.9",
]

[project.scripts]
sb = "sciencebro.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "hypothesis>=6.100",
    "pypdf>=6.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sciencebro"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
