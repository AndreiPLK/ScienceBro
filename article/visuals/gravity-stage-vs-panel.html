<!DOCTYPE html><html><head><meta charset='utf-8'><style>
body{margin:0;width:1340px;height:760px;background:radial-gradient(ellipse at 50% 0%,#161632 0%,#07070f 65%);
font-family:'Segoe UI',Arial,sans-serif;color:#dfe9ff}
.t{position:absolute;left:0;right:0;top:22px;text-align:center;font-size:27px;font-weight:700;color:#eafdff;
text-shadow:0 0 18px rgba(5,217,232,.6)}
.bottom{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-size:21px;font-weight:600;color:#f9f871;
text-shadow:0 0 14px rgba(249,248,113,.4)}
svg{position:absolute;top:70px;left:0}
</style></head><body>
<div class="t">GRAVITY UNDER ONE QUANTUM RULE — what changes with dimensions?</div>
<svg width="1340" height="620" viewBox="0 0 1340 620">
  <!-- divider -->
  <line x1="670" y1="10" x2="670" y2="580" stroke="#2a2a4a" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- LEFT PANEL: OUR WORLD D=4 -->
  <text x="335" y="46" fill="#9ff5ff" font-size="21" font-weight="700" text-anchor="middle">OUR WORLD: D = 4</text>
  <text x="335" y="72" fill="#7f93bb" font-size="14" text-anchor="middle">no cliff exists at all</text>
  <!-- flat plateau -->
  <polygon points="90,420 580,420 610,470 60,470" fill="rgba(5,217,232,0.16)" stroke="#05d9e8" stroke-width="2.5"/>
  <!-- candidates alive: dots on plateau -->
  <g fill="#3fe7f5">
    <circle cx="150" cy="412" r="6"/><circle cx="210" cy="412" r="6"/><circle cx="275" cy="412" r="6"/>
    <circle cx="405" cy="412" r="6"/><circle cx="470" cy="412" r="6"/><circle cx="530" cy="412" r="6"/>
  </g>
  <!-- the string among them, safe -->
  <text x="340" y="418" fill="#f9f871" font-size="26" text-anchor="middle">✦</text>
  <text x="340" y="360" fill="#f9f871" font-size="14" text-anchor="middle">the string — one of many</text>
  <text x="335" y="515" fill="#c6f24e" font-size="16" font-weight="600" text-anchor="middle">EVERYONE SURVIVES (40/40 exact scans)</text>
  <text x="335" y="543" fill="#7f93bb" font-size="13.5" text-anchor="middle">gravity here is NOT forced to be string-like</text>

  <!-- RIGHT PANEL: HIGH DIMENSIONS -->
  <text x="1005" y="46" fill="#ff5f95" font-size="21" font-weight="700" text-anchor="middle">HIGH DIMENSIONS: D = 23</text>
  <text x="1005" y="72" fill="#7f93bb" font-size="14" text-anchor="middle">the cliff has arrived (it appears at D = 9)</text>
  <!-- plateau with cliff -->
  <polygon points="760,420 1105,420 1090,470 745,470" fill="rgba(5,217,232,0.16)" stroke="#05d9e8" stroke-width="2.5"/>
  <!-- cliff wall -->
  <line x1="1105" y1="420" x2="1105" y2="560" stroke="#ff2a6d" stroke-width="4"/>
  <line x1="1090" y1="470" x2="1090" y2="585" stroke="#ff2a6d" stroke-width="2.5" opacity="0.55"/>
  <text x="1150" y="500" fill="#ff5f95" font-size="14">THE CLIFF</text>
  <text x="1150" y="520" fill="#ff5f95" font-size="13">falls along our</text>
  <text x="1150" y="538" fill="#ff5f95" font-size="13">formula Tₙ(λ)</text>
  <!-- dead candidates fallen below -->
  <g fill="#3a3a55" font-size="15" text-anchor="middle">
    <text x="1160" y="585">✕</text><text x="1200" y="575">✕</text><text x="1240" y="588">✕</text><text x="1275" y="578">✕</text>
  </g>
  <text x="1218" y="605" fill="#5a5a7a" font-size="12.5" text-anchor="middle">the ones who stepped further</text>
  <!-- the string exactly on the edge -->
  <text x="1100" y="416" fill="#f9f871" font-size="26" text-anchor="middle">✦</text>
  <circle cx="1100" cy="408" r="17" fill="none" stroke="#f9f871" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="1010" y="360" fill="#f9f871" font-size="14" text-anchor="end">the string — standing exactly on the edge</text>
  <line x1="1020" y1="366" x2="1085" y2="392" stroke="#f9f871" stroke-width="1.2"/>
  <text x="930" y="515" fill="#ff5f95" font-size="16" font-weight="600" text-anchor="middle">ONE MORE DIMENSION AND IT FALLS (D = 24)</text>
  <text x="930" y="543" fill="#7f93bb" font-size="13.5" text-anchor="middle">λ_min(23) = 1 exactly · proven, not fitted</text>
</svg>
<div class="bottom">STRING UNIQUENESS IS A FUNCTION OF DIMENSION — now written as one exact formula, every point exact</div>
</body></html>
