findings_not_blocking:
  - >-
    MD ARITHMETIC SLIP (Lemma 3 proof, section 2): the file writes
    "H - r - (t-1) >= H - 2r + 1 = (D-1)/2 + 2(n-2-r)". The correct value is
    H - 2r + 1 = (D+3)/2 + 2(n-2-r); the printed expression is smaller by 2.
    36/36 tested (n,r,D) disagree with the printed form and agree with the
    corrected one. Direction is conservative (the file understates its own
    margin), so Lemma 3 and everything downstream stand. Fix the display.
  - >-
    MD ARITHMETIC SLIP (Theorem 6 proof, section 3): "H/2 = (D+4n-7)/4 > n-2
    exactly when D > 3" is false; the equivalence threshold is D > -1
    (witness n=5, D=-9/10: H/2 = 7/2 - ... > n-2 holds while D > 3 fails).
    D > 3 still IMPLIES the vertex condition, so Theorem 6 is unaffected; the
    word "exactly" is wrong and should read "in particular when D > 3".
  - >-
    Scope note, not an error: the theorem's domain is 3 <= j <= n-1. At j = n
    (r = n-1) Lemma 3 fails for even n because e_{n-1}(b) = 0, and the Newton
    chain terminates. The .md's parenthetical about p_t = 0 is exactly what
    protects this; no probe found (*) true with a non-positive knife at j = n
    either, but the theorem should not be quoted for j = n.
  - >-
    Tightness: between D_max(*) and the first D at which the reference knife
    actually turns negative there is a factor 3.6 to 6.2 in D on the probed
    cells, and (*) is EMPTY (no admissible D > 3) in 12/36 probed (n,j,lam)
    cells. Consistent with the .md's own "honest size of the region" section.
  - >-
    UNSTATED (but satisfied) HYPOTHESIS in Theorem 9, section 4b: the step
    "using w >= (1-eta)u" needs a >= 1 to raise both sides to the power a-1.
    a = C - r + 1 = n - 1/2 - r >= 3/2 on r <= n-2, so it holds; it should be
    said. Checked over the whole Theorem 9 grid: 0 violations.
  - >-
    Not validated here: any novelty/prior-art claim (finite free probability,
    Marcus-Spielman-Srivastava). This validation covers correctness of the
    derivation and its numerical claims only.
