claims:
  - id: CL-0001
    statement: >-
      The AInstein authors report Lorentzian, numerically Einstein-vacuum candidate
      metrics of algebraically general Petrov type with a trapped interior, distinct
      from Schwarzschild, found by their extended PINN architecture.
    state: source-supported
    evidence_ids: [EV-0001, EV-0002]
    contradicting_evidence_ids: []
    experiment_ids: []
    validation_ids: []
    allowed_public_wording: null
    blockers: []

  - id: CL-0002
    statement: >-
      At least one exported AInstein candidate remains approximately Ricci-flat,
      Lorentzian, and non-Schwarzschild under an independent evaluator on unseen
      sample points with convergent residuals.
    state: speculative
    evidence_ids: []
    contradicting_evidence_ids: []
    experiment_ids: [EXP-0002]
    validation_ids: [VAL-0001]
    allowed_public_wording: null
    blockers:
      - "First retrained candidate FAILED the frozen criteria (VAL-0001); the paper's own checkpoints remain unavailable — request to authors pending founder approval."
      - "Seed-to-seed variability being measured (EXP-0003, seed 124, running)."

  - id: CL-0003
    statement: >-
      A Petrov type-I black-hole candidate retrained verbatim from the committed
      upstream configuration (hps_petrovI_bh.yaml @54736e46, seed 123, 500 epochs,
      one documented epochs fix) does NOT meet the pre-frozen vacuum-comparability
      criteria under independent finite-difference evaluation on hidden points:
      max|Ricci| median 0.915 vs frozen limit 0.286 and reproduced Schwarzschild
      baseline 0.123, with FD-converged residuals and valid Lorentzian signature.
    state: experimentally-supported
    evidence_ids: [EV-0001]
    contradicting_evidence_ids: []
    experiment_ids: [EXP-0001, EXP-0002]
    validation_ids: [VAL-0001]
    allowed_public_wording: >-
      In our independent re-training of the committed AInstein black-hole
      configuration, the resulting candidate did not reach the vacuum quality of our
      reproduced Schwarzschild baseline under identical independent evaluation. This
      says nothing definitive about the authors' own (unpublished) candidate
      checkpoints.
    blockers:
      - "Single seed so far; EXP-0003 (seed 124) running to measure variability."
      - "Not independently validated by a second implementation or reviewer yet."
