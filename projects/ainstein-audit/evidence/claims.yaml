claims:
  - id: CL-0001
    statement: >-
      The AInstein authors report Lorentzian, numerically Einstein-vacuum candidate
      metrics of algebraically general Petrov type with a trapped interior, distinct
      from Schwarzschild, found by their extended PINN architecture.
    state: source-supported
    evidence_ids: [EV-0001, EV-0002]
    contradicting_evidence_ids: []
    experiment_ids: []
    validation_ids: []
    allowed_public_wording: null
    blockers: []

  - id: CL-0002
    statement: >-
      At least one exported AInstein candidate remains approximately Ricci-flat,
      Lorentzian, and non-Schwarzschild under an independent evaluator on unseen
      sample points with convergent residuals.
    state: speculative
    evidence_ids: []
    contradicting_evidence_ids: []
    experiment_ids: [EXP-0002]
    validation_ids: [VAL-0001]
    allowed_public_wording: null
    blockers:
      - "Seed 123 FAILED, seed 124 PASSED the frozen vacuum criteria (VAL-0001/0002) — vacuum comparability achieved for one of two seeds."
      - "Petrov-type (algebraic generality) and non-Schwarzschild diagnostics not yet independently implemented — required before this claim can advance."
      - "The paper's own checkpoints remain unavailable — request to authors pending founder approval."

  - id: CL-0003
    statement: >-
      A Petrov type-I black-hole candidate retrained verbatim from the committed
      upstream configuration (hps_petrovI_bh.yaml @54736e46, seed 123, 500 epochs,
      one documented epochs fix) does NOT meet the pre-frozen vacuum-comparability
      criteria under independent finite-difference evaluation on hidden points:
      max|Ricci| median 0.915 vs frozen limit 0.286 and reproduced Schwarzschild
      baseline 0.123, with FD-converged residuals and valid Lorentzian signature.
    state: experimentally-supported
    evidence_ids: [EV-0001]
    contradicting_evidence_ids: []
    experiment_ids: [EXP-0001, EXP-0002]
    validation_ids: [VAL-0001]
    allowed_public_wording: >-
      In our independent re-training of the committed AInstein black-hole
      configuration, the resulting candidate did not reach the vacuum quality of our
      reproduced Schwarzschild baseline under identical independent evaluation. This
      says nothing definitive about the authors' own (unpublished) candidate
      checkpoints.
    blockers:
      - "Seed 124 replicate PASSED the same criteria (VAL-0002): the FAIL is seed-specific, not config-universal — statement scope narrowed accordingly."
      - "Not independently validated by a second implementation or reviewer yet."

  - id: CL-0004
    statement: >-
      A Petrov type-I black-hole candidate retrained from the committed upstream
      configuration (seed 124) is, under an independent finite-difference evaluation,
      simultaneously (a) vacuum-comparable to our reproduced Schwarzschild baseline on
      hidden points and (b) algebraically general: our own Weyl-operator speciality
      index gives S = 2.27..2.55, while the same code returns S = 1 to 4e-16 on
      analytic Schwarzschild and to 1.7e-6 on a trained neural Schwarzschild.
    state: experimentally-supported
    evidence_ids: [EV-0001]
    contradicting_evidence_ids: []
    experiment_ids: [EXP-0001, EXP-0003]
    validation_ids: [VAL-0002, VAL-0003]
    allowed_public_wording: >-
      In an independent re-implementation of the geometry checks, one of our retrained
      AInstein black-hole candidates is both approximately vacuum (to the level of our
      own reproduced Schwarzschild baseline) and algebraically general rather than
      Schwarzschild-like. This corroborates that the published architecture can move a
      metric off the algebraically special family, which the paper trains for
      explicitly; it is not by itself evidence of a new exact solution, and it says
      nothing yet about the authors' own unpublished checkpoints.
    blockers:
      - "S ~ 2 is an explicit training target of the upstream loss (Eq. 47), so this corroborates the method rather than demonstrating a new solution."
      - "Trapped-surface / horizon structure not yet independently verified."
      - "Single seed satisfies both conditions; seed 123 is type I but fails vacuum."
      - "Not reviewed by a qualified external expert (NEEDS EXPERT REVIEW)."
